name: realtime-parity

# The three frontends each carry their own copy of the realtime core. ADR 0001
# explains why, and the bet is that the copies stay identical. This is what
# checks.
#
# It runs here rather than in each frontend's CI on purpose. A coordinated
# change lands as three PRs that merge one at a time, so a per-repo gate would
# be red for the second and third by design — a gate that is expected to fail is
# one people learn to ignore. Here it goes red for as long as the set is
# genuinely inconsistent, which is the thing worth knowing.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches a set left half-landed, which is the failure this is really for.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: BOILPLATE

      # Public siblings, so no token. Shallow: the check reads the working tree.
      - uses: actions/checkout@v4
        with: { repository: fredokim/boilplate-react, path: react-boilerplate }
      - uses: actions/checkout@v4
        with: { repository: fredokim/boilplate-next, path: next-boilerplate }
      - uses: actions/checkout@v4
        with: { repository: fredokim/boilplate-vue, path: vue-boilerplate }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BOILPLATE/package-lock.json

      - run: npm ci
        working-directory: BOILPLATE

      - run: npm run realtime:parity
        working-directory: BOILPLATE
        env:
          REPO_ROOT: ${{ github.workspace }}
